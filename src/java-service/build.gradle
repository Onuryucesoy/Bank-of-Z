/*
 * Bank of Z - Java service foundation (migration Phase 1).
 * Copybook-derived models, EBCDIC/packed/zoned codecs, Db2 persistence,
 * ID allocation and service interfaces. No transaction logic is ported yet.
 */

plugins {
    id 'java-library'
}

group = 'com.ibm.bankofz'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Same Db2 driver as src/base/ims/java. Only java.sql APIs are used at compile time.
    runtimeOnly 'com.ibm.db2:jcc:12.1.5.0'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'com.h2database:h2:2.2.224'
}

def repoRoot = rootProject.projectDir.parentFile.parentFile

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all', '-Werror']
}

test {
    useJUnitPlatform()
    // Golden-master fixtures and the frozen copybooks live outside this module.
    systemProperty 'bankofz.repoRoot', repoRoot.absolutePath
    inputs.dir(new File(repoRoot, 'tests/golden')).withPropertyName('goldenFixtures')
    testLogging {
        events 'failed'
        showStandardStreams = System.getProperty('showOutput') != null
        exceptionFormat 'full'
    }
}
