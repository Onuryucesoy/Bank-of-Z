subprojects {
    apply plugin: 'java-library'

    group = 'com.ibm.bankofz'
    version = '1.0.0-SNAPSHOT'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.junit.jupiter:junit-jupiter-params'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-Xlint:all,-serial,-processing' << '-Werror'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'bankz.repoRoot', rootProject.projectDir.toPath().resolve('../../..').normalize().toString()
        testLogging { events 'failed'; exceptionFormat 'full' }
    }
}
