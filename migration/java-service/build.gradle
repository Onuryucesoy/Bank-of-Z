plugins {
    id 'java'
    id 'application'
    id 'jvm-test-suite'
}

group = 'com.ibm.bankofz.migration'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

def jerseyVersion = '3.1.9'
def jacksonVersion = '2.17.2'

dependencies {
    implementation "jakarta.ws.rs:jakarta.ws.rs-api:3.1.0"
    implementation "org.glassfish.jersey.containers:jersey-container-jdk-http:${jerseyVersion}"
    implementation "org.glassfish.jersey.inject:jersey-hk2:${jerseyVersion}"
    implementation "org.glassfish.jersey.media:jersey-media-json-jackson:${jerseyVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
}

// Repo root (two levels up) so tests read the real openapi.yaml, zosAssets and golden-master fixtures.
def repoRoot = rootDir.toPath().resolve('../..').normalize().toString()

testing {
    suites {
        configureEach {
            useJUnitJupiter('5.10.3')
        }
        test {
            targets.all {
                testTask.configure { systemProperty 'bankofz.repoRoot', repoRoot }
            }
        }
        goldenMaster(JvmTestSuite) {
            dependencies {
                implementation project()
                implementation "com.networknt:json-schema-validator:1.5.1"
                implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
                implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${jacksonVersion}"
            }
            targets.all {
                testTask.configure {
                    systemProperty 'bankofz.repoRoot', repoRoot
                    shouldRunAfter(test)
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn testing.suites.goldenMaster
}

application {
    mainClass = 'com.ibm.bankofz.migration.Main'
}
